# Deploy the app — by hand only, never on a push (the author, 2026-11-07).
#   GitHub → Actions → "Deploy the app" → Run workflow
#   or:  gh workflow run deploy-app.yml
#
# Builds app/ and deploys it to BOTH app sites, one after the other:
# firebase-tools 15.16 refuses a deploy target that names two sites
# (CLAUDE.md §4, "Deploy:"), so .firebaserc is pointed at one site per
# deploy — here, on GitHub's machine only. The landing page (target home)
# and the contact form are not touched.
#
# The key is the repository secret FIREBASE_SERVICE_ACCOUNT_IQRA___LEARN_QURANIC_ARABIC,
# made by `firebase init hosting:github` on 2026-11-23.
name: Deploy the app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    # only what is on main goes live
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the app (not the raw recordings)
        uses: actions/checkout@v4
        with:
          sparse-checkout: app
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Deploy to both app sites
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IQRA___LEARN_QURANIC_ARABIC }}
        run: |
          set -euo pipefail
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          cp .firebaserc "$RUNNER_TEMP/firebaserc"
          for site in iqra1447 iqra---learn-quranic-arabic; do
            jq --arg s "$site" '.targets["iqra---learn-quranic-arabic"].hosting.app = [$s]' "$RUNNER_TEMP/firebaserc" > .firebaserc
            npx --yes firebase-tools@15.16.0 deploy --only hosting:app \
              --project iqra---learn-quranic-arabic --non-interactive \
              --message "GitHub Actions run ${{ github.run_number }}, ${GITHUB_SHA::7}"
          done
          rm -f "$RUNNER_TEMP/sa.json"

      - name: What the sites serve now
        run: |
          echo "Built: $(cat app/dist/version.json)" >> "$GITHUB_STEP_SUMMARY"
          for site in iqra1447 iqra---learn-quranic-arabic; do
            echo "- $site: $(curl -s "https://$site.web.app/version.json?x=$RANDOM")" >> "$GITHUB_STEP_SUMMARY"
          done
