<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>IQRA 1447 — opening your workbook page</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #14513a; background: #fbf7ee; }
  main { text-align: center; padding: 24px; max-width: 420px; }
  a { color: #14513a; }
  .btn { display: inline-block; margin: 8px 6px; padding: 12px 18px; border: 2px solid #c1a054; border-radius: 12px; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <p id="msg">Opening your workbook page…</p>
  <p id="links"></p>
</main>
<script>
// The QR on a workbook section opener points here: /go/<section id>, e.g.
// /go/L1S4. The paper carries the section id and never a lesson number or a
// page, so no reprint can go wrong: this page looks the section up in the
// crosswalk the build writes (crosswalk.json) and sends the reader to the
// app's companion page for that section — or, while the app is switched off
// at /admin (config/site, the same switch the landing page obeys), to the PDF
// at the section's page.
(async () => {
  const id = decodeURIComponent(location.pathname.replace(/^\/go\/?/, '')).replace(/\/+$/, '').toUpperCase();
  const msg = document.getElementById('msg');
  const links = document.getElementById('links');
  const home = () => { msg.textContent = 'That code is not one of the workbook sections.'; links.innerHTML = '<a class="btn" href="/">IQRA 1447</a>'; };
  if (!/^L[1-3]S\d+$/.test(id)) return home();
  let cw;
  try { cw = await (await fetch('/workbooks/crosswalk.json', { cache: 'no-store' })).json(); } catch { return home(); }
  const level = cw.levels[id[1]];
  const section = level && level.sections.find((s) => s.id === id);
  if (!section) return home();
  const pdf = `/workbooks/${level.file}#page=${section.physical}`;
  let appOn = false;
  try {
    const doc = await (await fetch('https://firestore.googleapis.com/v1/projects/iqra---learn-quranic-arabic/databases/(default)/documents/config/site', { cache: 'no-store' })).json();
    appOn = doc && doc.fields && doc.fields.appVisible && doc.fields.appVisible.booleanValue === true;
  } catch { appOn = false; }
  const target = appOn && section.companion ? section.companion : pdf;
  msg.textContent = `Section ${section.section} · ${section.title}`;
  links.innerHTML = `<a class="btn" href="${target}">Open</a>` + (appOn && section.companion ? ` <a class="btn" href="${pdf}">The printed page</a>` : '');
  location.replace(target);
})();
</script>
</body>
</html>
