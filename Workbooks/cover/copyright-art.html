<!doctype html>
<!-- The three images the copyright page uses: the IQRA 1447 lockup (mark +
     wordmark in the brand's Perpetua Titling), the gold divider, and the closing
     diamond. One part per render: ?part=lockup|divider|diamond. Transparent. -->
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent}
  .part{display:none}
  .lockup{width:2.4in;height:1.45in;text-align:center}
  .lockup img{height:1.05in;display:block;margin:0 auto .07in}
  .lockup div{font-family:'Perpetua Titling MT',serif;font-weight:300;font-size:20pt;line-height:1;
              letter-spacing:.14em;text-indent:.14em;color:#14513A}
  .divider{width:3.25in;height:.14in;display:none;align-items:center;gap:.1in}
  .divider i{flex:1;border-top:.0125in solid #C1A054}
  .divider b,.diamond b{width:.075in;height:.075in;background:#C1A054;transform:rotate(45deg)}
  .diamond{width:.12in;height:.12in;align-items:center;justify-content:center}
</style></head>
<body>
  <div class="part lockup" id="lockup"><img src="art/iqra-mark.png" alt=""><div>IQRA 1447</div></div>
  <div class="part divider" id="divider"><i></i><b></b><i></i></div>
  <div class="part diamond" id="diamond"><b></b></div>
<script>
  const part = new URLSearchParams(location.search).get('part') || 'lockup';
  document.getElementById(part).style.display = part === 'lockup' ? 'block' : 'flex';
</script>
</body></html>
